name: Обновить расписание

on:
  schedule:
    # 03:17 по Москве (UTC+3).
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать расписание ИС2-241…244 на 6 недель и список групп
        id: fetch
        continue-on-error: true
        run: python3 scripts/update_schedule.py --weeks 3

      - name: Закоммитить, если данные изменились
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Данные не изменились."
            exit 0
          fi
          git commit -m "Расписание: обновление данных $(TZ=Europe/Moscow date +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Проект Cloudflare Pages выкладывается через Direct Upload (без Git-интеграции).
      # Без секрета CLOUDFLARE_API_TOKEN шаг пропускается, данные попадут на сайт со следующим деплоем.
      - name: Выложить на Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name rasp-is2-241 --branch main --commit-dirty=true

      - name: Сообщить об ошибке загрузки
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Не удалось скачать часть расписания с kis.vgltu.ru — см. шаг загрузки."
          exit 1
