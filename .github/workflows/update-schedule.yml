name: Обновить расписание

on:
  push:
    branches: [main]
  schedule:
    # 03:17 по Москве (UTC+3).
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверить приложение и офлайн-хранилище
        run: |
          node scripts/selfcheck.mjs
          node scripts/check-bundles.mjs
          node scripts/check-sw-update.mjs
          python3 scripts/check_bundle_builder.py

      - uses: actions/cache/restore@v4
        with:
          path: work/bundle-resume
          key: bundles-${{ github.run_id }}
          restore-keys: bundles-

      - name: Скачать проверенные пакеты всех групп на две недели
        id: fetch
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 scripts/build_bundles.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/bundle-resume
          key: bundles-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Закоммитить, если данные изменились
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Данные не изменились."
            exit 0
          fi
          git commit -m "Расписание: обновление данных $(TZ=Europe/Moscow date +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN commits do not automatically trigger the branch-based Pages build.
      - name: Обновить зеркало GitHub Pages после ночного коммита
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

      # Проект Cloudflare Pages выкладывается через Direct Upload (без Git-интеграции).
      # Без секрета CLOUDFLARE_API_TOKEN шаг пропускается, данные попадут на сайт со следующим деплоем.
      - name: Выложить на Cloudflare Pages
        if: (github.event_name == 'push' || steps.commit.outputs.changed == 'true') && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name rasp-is2-241 --branch main --commit-dirty=true

      - name: Проверить опубликованную версию и оба пакета
        if: (github.event_name == 'push' || steps.commit.outputs.changed == 'true') && env.HAS_CF_TOKEN == 'true'
        run: node scripts/verify-release.mjs

      - name: Оформить выпуск v19 после проверки production
        if: github.event_name == 'push' && env.HAS_CF_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(node -p "JSON.parse(require('fs').readFileSync('version.json')).version")" = "19" ]; then
            if ! gh release view v19 > /dev/null 2>&1; then
              gh release create v19 --target "$GITHUB_SHA" --title "v19 — Исправлены баги версии 18" --notes-file .github/release-v19.md
            fi
          fi

      - name: Сообщить об отсутствии доступа к Cloudflare
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN отсутствует. GitHub обновлён, Cloudflare этим заданием не опубликован."

      - name: Сообщить об ошибке загрузки
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Не удалось скачать часть расписания с kis.vgltu.ru — см. шаг загрузки."
          exit 1
